<div class="palette">
  <h3 class="palette__title">Components</h3>

  <div
    cdkDropList
    id="palette-drop-list"
    [cdkDropListConnectedTo]="['canvas-drop-list']"
    [cdkDropListSortingDisabled]="true"
    [cdkDropListEnterPredicate]="noReturn"
    class="palette__list"
  >
    @for (item of paletteItems; track item.type) {
      <div class="palette__item" cdkDrag [cdkDragData]="item">
        <span class="palette__icon" [innerHTML]="item.icon"></span>
        <span class="palette__label">{{ item.label }}</span>
        <div *cdkDragPlaceholder class="palette__drag-placeholder"></div>
      </div>
    }
  </div>
</div>
