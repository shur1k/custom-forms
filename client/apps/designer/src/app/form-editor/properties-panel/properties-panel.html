<div class="props-panel">
  @if (!component()) {
    <p class="props-panel__empty">Select a component to edit its properties.</p>
  } @else {
    <h3 class="props-panel__title">{{ component()!.type | titlecase }}</h3>

    <div class="props-panel__section">
      <h4 class="props-panel__section-title">Content</h4>

      <label class="props-panel__field">
        <span class="props-panel__label">Label</span>
        <input
          class="props-panel__input"
          type="text"
          [value]="component()!.props.label"
          (input)="updateProp('label', $any($event.target).value)"
        />
      </label>

      @if (component()!.type !== 'button') {
        <label class="props-panel__field props-panel__field--checkbox">
          <input
            type="checkbox"
            [checked]="component()!.props.showTitle"
            (change)="updateProp('showTitle', $any($event.target).checked)"
          />
          <span class="props-panel__label">Show Title</span>
        </label>
      }

      <label class="props-panel__field props-panel__field--checkbox">
        <input
          type="checkbox"
          [checked]="component()!.props.disabled"
          (change)="updateProp('disabled', $any($event.target).checked)"
        />
        <span class="props-panel__label">Disabled</span>
      </label>

      <label class="props-panel__field">
        <span class="props-panel__label">Text Color</span>
        <select
          class="props-panel__select"
          [value]="component()!.props.textColor"
          (change)="updateProp('textColor', $any($event.target).value)"
        >
          @for (opt of colorOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </label>
    </div>

    <div class="props-panel__section">
      <h4 class="props-panel__section-title">Layout</h4>

      <label class="props-panel__field">
        <span class="props-panel__label">Width (columns, 1–12)</span>
        <input
          class="props-panel__input"
          type="number"
          min="1"
          max="12"
          [value]="component()!.w"
          (input)="updateLayout('w', +$any($event.target).value)"
        />
      </label>

      <label class="props-panel__field">
        <span class="props-panel__label">Height (rows, ≥1)</span>
        <input
          class="props-panel__input"
          type="number"
          min="1"
          [value]="component()!.h"
          (input)="updateLayout('h', +$any($event.target).value)"
        />
      </label>
    </div>
  }
</div>
